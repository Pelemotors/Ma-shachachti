name: CI

on:
  push:
    branches:
      - feature/smith-control-center
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Locked install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # lint is an alias of typecheck in package.json. No ESLint is installed.
      # Playwright E2E is added only after its isolated test environment exists.
