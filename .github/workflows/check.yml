name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/personal-agent-freedom
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Auto-format branch
        run: |
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: prettier-format personal agent branch"
            git push origin HEAD:arch/personal-agent-freedom
          fi
      - run: npm run format:check
      - run: npm run deps:check
      - name: Typecheck
        run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
