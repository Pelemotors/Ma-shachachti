name: Agent verification

on:
  push:
    branches:
      - arch/personal-agent-freedom

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deps:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
