name: Privacy gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/privacy-ci-gate.mjs
      - run: npm test
